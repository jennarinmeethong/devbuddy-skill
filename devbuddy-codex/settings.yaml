schema_version: 1
adapter:
  name: devbuddy-codex
  source_spec_version: 0.4.4
  invocation: $devbuddy
  entrypoint: orchestrator
  explicit_subagent_model_and_effort: required
governance:
  git_mode: read_only
  require_uncertainty_question: true
  require_cost_approval: true
  require_knowledge_impact_approval: true
orchestration:
  project_settings_path: .devbuddy/settings.yaml
  approved_models: []
  approved_effort_levels: []
  max_concurrency: 2
  task_timeout_seconds: 900
  retry_limit: 1
  model_effort_selection_policy: minimum_sufficient
  adapter_profile_selection: current_adapter
  subagent_capability: required
  model_transport: subagent.model_parameter
  effort_transport: subagent.reasoning_effort_parameter
memory:
  default_root: .devbuddy
  locator_key: memory_root
  knowledge_root: knowledge-base
  project_registry_key: workspace.projects
tools:
  # Default approval boundary for custom tools. A workspace may add a runtime in
  # its own settings after the user approves it; a tool whose runtime is not
  # listed is a dispatch block, not a judgement call. See references/custom-tools.md.
  approved_custom_tool_runtimes: [python, dotnet]
  install_without_user_approval: false
quality:
  required_checks: [policy_compliance, knowledge_health, adapter_conformance, manual_conformance]
